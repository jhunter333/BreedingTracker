<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17634b"><title>Breeding Tracker</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#18352d;background:#f4f8f5}*{box-sizing:border-box}body{margin:0}header{background:#17634b;color:white;padding:calc(env(safe-area-inset-top) + 18px) 18px 18px}header h1{margin:0;font-size:23px}header small{opacity:.85}main{max-width:760px;margin:auto;padding:16px 16px 100px}.card{background:white;border:1px solid #dce9e1;border-radius:15px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #163d2610}.muted{color:#657b70;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stats .card{text-align:center;padding:12px 3px}.stats b{display:block;font-size:25px;color:#17634b}h2{font-size:19px;margin:8px 0 15px}h3{margin:0 0 9px;font-size:16px}label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #c8d8ce;border-radius:10px;font:inherit;background:#fff;color:#1d352d}textarea{min-height:70px}button{border:0;border-radius:10px;padding:11px 15px;font-weight:650;font-size:14px;background:#17634b;color:white;cursor:pointer}button.secondary{background:#e8f3ed;color:#17634b}button.danger{background:#fce9e8;color:#a43131}button:disabled{opacity:.5}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row>*{min-width:0}.hidden{display:none!important}nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #dce9e1;display:flex;justify-content:space-around;padding:9px 5px calc(9px + env(safe-area-inset-bottom));z-index:3}nav button{background:transparent;color:#63796c;padding:9px 6px;font-size:12px}nav button.active{color:#17634b;background:#e8f3ed}.item{border-top:1px solid #e8eee9;padding:12px 0}.item:first-child{border-top:0}.tag{font-size:11px;border-radius:8px;background:#e8f3ed;padding:4px 7px;color:#17634b}.notice{background:#fff9e9;border:1px solid #f0dfae;border-radius:12px;padding:12px;font-size:13px;margin-bottom:14px}.empty{padding:22px;text-align:center;color:#72847a}.inline{display:flex;gap:8px}.inline>*{flex:1}.inline button{flex:0 0 auto}.day{padding:8px 0;border-bottom:1px solid #e5eee8}summary{cursor:pointer;font-weight:600}.small{font-size:12px}#toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:#183b2d;color:white;border-radius:9px;padding:10px 16px;display:none;z-index:9;max-width:90%;text-align:center}</style></head><body><header><h1>🐾 Breeding Tracker</h1><small>Multi-species breeding management · Version 1</small></header><main><div class="notice">Your records are stored <b>only in this browser on this device</b>. Use Settings → Export Backup regularly. Clearing browser data or using another browser can remove access to these records.</div><section id="home"></section><section id="animals" class="hidden"></section><section id="bloodlines" class="hidden"></section><section id="calendar" class="hidden"></section><section id="settings" class="hidden"></section></main><nav id="nav"><button data-tab="home" class="active">⌂ Home</button><button data-tab="animals">🐾 Animals</button><button data-tab="bloodlines">♧ Bloodlines</button><button data-tab="calendar">▦ Calendar</button><button data-tab="settings">⚙ Settings</button></nav><div id="toast" role="status"></div><script>
(()=>{'use strict';const KEY='breeding-tracker-v1',speciesList=['Dog','Horse','Chicken','Cat','Pig','Cattle','Goat','Sheep','Duck','Goose','Turkey','Quail','Pigeon','Parrot','Rabbit','Guinea pig','Buffalo','Donkey','Pony','Camel','Alpaca','Llama','Deer','Tilapia','Carp','Catfish','Shrimp','Snake','Turtle','Lizard','Bee'];let db={animals:[],bloodlines:[],events:[],species:[]},tab='home',editing=null;try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.animals)&&Array.isArray(x.bloodlines)&&Array.isArray(x.events)){db={...db,...x}}}catch(e){}const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Storage failed. Export a backup and check available storage.');return false}},toast=s=>{const el=$('toast');el.textContent=s;el.style.display='block';setTimeout(()=>el.style.display='none',2500)},options=(arr,selected='',placeholder='Choose')=>`<option value="">${esc(placeholder)}</option>`+arr.map(s=>`<option value="${esc(s)}" ${s===selected?'selected':''}>${esc(s)}</option>`).join(''),species=()=>[...new Set([...speciesList,...db.species,...db.animals.map(a=>a.species)])].sort((a,b)=>a.localeCompare(b)),animalName=id=>db.animals.find(a=>a.id===id)?.name||'Unknown animal',format=d=>d?new Date(d+'T12:00:00Z').toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric',timeZone:'UTC'}):'—',addDays=(date,n)=>{const d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};function estimate(s,e,d){if(!d)return null;const incub={Chicken:21,Duck:28,Goose:30,Turkey:28,Quail:17,Pigeon:18,Parrot:24};const gest={Dog:63,Cat:65,Horse:340,Pig:114,Cattle:283,Goat:150,Sheep:147,Rabbit:31,Guinea_pig:68,Donkey:365,Alpaca:345,Llama:350,Buffalo:310};if(e==='Incubation started'&&incub[s])return{date:addDays(d,incub[s]),label:'Estimated hatch'};if((e==='Mating'||e==='Artificial insemination')&&gest[s])return{date:addDays(d,gest[s]),label:'Estimated birth'};return null}function show(t){tab=t;['home','animals','bloodlines','calendar','settings'].forEach(k=>$(k).classList.toggle('hidden',k!==t));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render();window.scrollTo(0,0)}function render(){renderHome();renderAnimals();renderBloodlines();renderCalendar();renderSettings()}function renderHome(){const future=db.events.filter(e=>e.estimate&&e.estimate.date>=new Date().toISOString().slice(0,10)).sort((a,b)=>a.estimate.date.localeCompare(b.estimate.date));$('home').innerHTML=`<h2>Overview</h2><div class="stats"><div class="card"><b>${db.animals.length}</b><span class="muted">Animals</span></div><div class="card"><b>${db.events.length}</b><span class="muted">Records</span></div><div class="card"><b>${future.length}</b><span class="muted">Upcoming</span></div></div><div class="card"><div class="row"><h3>My Animals</h3><button data-action="add-animal">+ Add Animal</button></div>${db.animals.length?db.animals.slice(-5).reverse().map(a=>`<div class="item"><b>${esc(a.name)}</b><div class="muted">${esc(a.species)} · ${esc(a.breed||'Breed not set')} · ${esc(a.sex)}</div></div>`).join(''):'<div class="empty">No animals yet. Add your first animal to begin.</div>'}</div><div class="card"><h3>Upcoming milestones</h3>${future.length?future.slice(0,8).map(e=>`<div class="item"><b>${esc(animalName(e.animalId))}</b><div class="muted">${esc(e.estimate.label)} · ${format(e.estimate.date)}</div></div>`).join(''):'<div class="empty">No estimated milestones yet</div>'}</div>`}function renderAnimals(){const a=editing?db.animals.find(x=>x.id===editing):null;$('animals').innerHTML=`<div class="row"><h2>Animals</h2><button data-action="new-animal">+ New</button></div><div class="card" id="animal-form"><h3>${a?'Edit animal':'Add Animal'}</h3><form id="addAnimal"><label>Species</label><select name="species" required>${options(species(),a?.species||'','Select species')}</select><label>Or add custom species</label><input name="customSpecies" placeholder="New species (optional)"><label>Animal name or ID</label><input name="name" required maxlength="100" value="${esc(a?.name||'')}" placeholder="Name or identification"><label>Breed</label><input name="breed" value="${esc(a?.breed||'')}" placeholder="Optional"><label>Sex</label><select name="sex">${options(['Female','Male','Unknown'],a?.sex||'Unknown','Select sex')}</select><label>Date of birth</label><input type="date" name="dob" value="${esc(a?.dob||'')}"><label>Bloodline</label><select name="bloodline">${options(db.bloodlines.map(b=>b.name).sort(),a?.bloodline||'','Not assigned')}</select><label>Notes</label><textarea name="notes" placeholder="Markings, details, observations">${esc(a?.notes||'')}</textarea><div class="actions"><button type="submit">${a?'Update Animal':'Save Animal'}</button>${a?'<button type="button" class="secondary" data-action="cancel-edit">Cancel</button>':''}</div></form></div><div class="card"><h3>Saved Animals (${db.animals.length})</h3>${db.animals.length?db.animals.map(a=>`<div class="item"><div class="row"><div><b>${esc(a.name)}</b><div class="muted">${esc(a.species)} · ${esc(a.breed||'Unknown breed')} · ${esc(a.sex)}</div><div class="small">Bloodline: ${esc(a.bloodline||'Not assigned')}</div></div><span class="tag">${db.events.filter(e=>e.animalId===a.id).length} events</span></div><div class="actions"><button class="secondary" data-action="edit-animal" data-id="${a.id}">Edit</button><button class="secondary" data-action="record-for" data-id="${a.id}">Record event</button><button class="danger" data-action="delete-animal" data-id="${a.id}">Delete</button></div></div>`).join(''):'<div class="empty">No saved animals</div>'}</div>`}function renderBloodlines(){$('bloodlines').innerHTML=`<h2>Bloodline Library</h2><div class="card"><h3>Add permanent bloodline</h3><form id="addBloodline"><label>Bloodline name</label><div class="inline"><input name="name" required maxlength="100" placeholder="Enter new bloodline"><button>Add</button></div></form><p class="muted">Saved names stay in this device's library until deleted. Deleting a name does not erase it from existing animal profiles.</p></div><div class="card"><h3>Saved Bloodlines (${db.bloodlines.length})</h3>${db.bloodlines.length?db.bloodlines.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(b=>`<div class="item row"><b>${esc(b.name)}</b><button class="danger" data-action="delete-bloodline" data-id="${b.id}">Delete</button></div>`).join(''):'<div class="empty">Add your first bloodline</div>'}</div>`}function renderCalendar(){const ev=db.events.slice().sort((a,b)=>b.date.localeCompare(a.date));$('calendar').innerHTML=`<h2>Breeding Records & Calendar</h2><div class="card"><h3>Add breeding event</h3>${db.animals.length?`<form id="addEvent"><label>Animal</label><select name="animalId" required>${options(db.animals.map(a=>a.id),'','Choose animal').replace(/<option value="([^"]+)">([^<]+)<\/option>/g,(m,id)=>`<option value="${id}">${esc(animalName(id))} (${esc(db.animals.find(a=>a.id===id)?.species)})</option>`)}</select><label>Event type</label><select name="type">${options(['Heat observed','Mating','Artificial insemination','Pregnancy confirmed','Pregnancy check','Birth','Egg laid','Incubation started','Hatched','Other'],'Mating','Choose event')}</select><label>Event date</label><input type="date" name="date" required value="${new Date().toISOString().slice(0,10)}"><label>Partner name or ID (optional)</label><input name="partner" placeholder="Breeding partner"><label>Outcome</label><select name="outcome">${options(['Pending','Successful','Unsuccessful','Unknown'],'Pending','Choose outcome')}</select><label>Notes</label><textarea name="notes" placeholder="Observations"></textarea><div class="actions"><button>Save Breeding Event</button></div></form>`:'<p class="muted">Add an animal first, then you can record breeding events.</p><button data-action="add-animal">Add Animal</button>'}</div><div class="card"><h3>Recorded Events (${ev.length})</h3>${ev.length?ev.map(e=>`<div class="item"><div class="row"><b>${esc(animalName(e.animalId))} — ${esc(e.type)}</b><span class="tag">${format(e.date)}</span></div><div class="muted">${esc(e.outcome||'Unknown')}${e.partner?' · Partner: '+esc(e.partner):''}</div>${e.estimate?`<div class="small">${esc(e.estimate.label)}: <b>${format(e.estimate.date)}</b></div>`:''}${e.notes?`<div class="small">${esc(e.notes)}</div>`:''}<div class="actions"><button class="danger" data-action="delete-event" data-id="${e.id}">Delete</button></div></div>`).join(''):'<div class="empty">No breeding records yet</div>'}</div><p class="muted">Estimated dates are general reference averages, not veterinary advice. Only mating/insemination for supported mammals or incubation-start for supported birds generates an estimate. Estimates do not confirm pregnancy or hatch success.</p>`}function renderSettings(){$('settings').innerHTML=`<h2>Settings & Backup</h2><div class="card"><h3>Protect your records</h3><p class="muted">Export a JSON backup and save it to Files, iCloud Drive, or another secure location. Backups include animal profiles, bloodlines, and events.</p><div class="actions"><button data-action="export">Export Backup</button><button class="secondary" data-action="import">Import Backup</button></div><input class="hidden" type="file" id="importFile" accept="application/json,.json"></div><div class="card"><h3>App information</h3><p>Breeding Tracker · Version 1</p><p class="muted">Offline single-file prototype. Local storage only; no account login, notifications, cloud sync, or photo uploads yet. Browser storage may be removed by device cleanup or privacy settings.</p></div><div class="card"><h3>Clear local records</h3><p class="muted">Export a backup before clearing.</p><button class="danger" data-action="clear">Delete All Local Data</button></div>`}document.addEventListener('click',e=>{const b=e.target.closest('[data-tab],[data-action]');if(!b)return;if(b.dataset.tab){editing=null;show(b.dataset.tab);return}const act=b.dataset.action,id=b.dataset.id;if(act==='add-animal'||act==='new-animal'){editing=null;show('animals')}else if(act==='edit-animal'){editing=id;show('animals')}else if(act==='cancel-edit'){editing=null;render()}else if(act==='record-for'){show('calendar');const s=document.querySelector('#addEvent select[name=animalId]');if(s)s.value=id}else if(act==='delete-animal'){if(confirm('Delete this animal AND its breeding events?')){db.animals=db.animals.filter(a=>a.id!==id);db.events=db.events.filter(e=>e.animalId!==id);save();render()}}else if(act==='delete-bloodline'){if(confirm('Remove this bloodline from the selection list? Existing animal profiles will keep their bloodline text.')){db.bloodlines=db.bloodlines.filter(x=>x.id!==id);save();render()}}else if(act==='delete-event'){if(confirm('Delete this breeding event?')){db.events=db.events.filter(x=>x.id!==id);save();render()}}else if(act==='export'){const blob=new Blob([JSON.stringify({app:'Breeding Tracker',version:1,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='BreedingTracker_Backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Backup file prepared')}else if(act==='import'){$('importFile').click()}else if(act==='clear'){if(confirm('Permanently delete all local Breeding Tracker data? Export a backup first.')&&confirm('Are you sure?')){db={animals:[],bloodlines:[],events:[],species:[]};editing=null;save();show('home')}}});document.addEventListener('submit',e=>{if(!['addAnimal','addBloodline','addEvent'].includes(e.target.id))return;e.preventDefault();const f=new FormData(e.target);if(e.target.id==='addAnimal'){const custom=String(f.get('customSpecies')||'').trim(),s=custom||String(f.get('species')||'');if(!s||!String(f.get('name')||'').trim()){alert('Species and animal name or ID are required.');return}if(custom&&!db.species.some(x=>x.toLowerCase()===custom.toLowerCase()))db.species.push(custom);const item={id:editing||uid(),species:s,name:String(f.get('name')).trim(),breed:String(f.get('breed')||'').trim(),sex:String(f.get('sex')||'Unknown'),dob:String(f.get('dob')||''),bloodline:String(f.get('bloodline')||''),notes:String(f.get('notes')||'')};if(editing)db.animals=db.animals.map(a=>a.id===editing?item:a);else db.animals.push(item);editing=null;save();show('home');toast('Animal saved')}else if(e.target.id==='addBloodline'){const name=String(f.get('name')||'').trim();if(!name)return;if(db.bloodlines.some(x=>x.name.toLowerCase()===name.toLowerCase())){alert('This bloodline already exists.');return}db.bloodlines.push({id:uid(),name});save();render();toast('Bloodline added')}else{const animalId=String(f.get('animalId')||''),a=db.animals.find(x=>x.id===animalId),type=String(f.get('type')||''),date=String(f.get('date')||'');if(!a||!date||!type){alert('Choose an animal, event, and date.');return}db.events.push({id:uid(),animalId,type,date,partner:String(f.get('partner')||'').trim(),outcome:String(f.get('outcome')||'Pending'),notes:String(f.get('notes')||'').trim(),estimate:estimate(a.species,type,date)});save();render();toast('Breeding event saved')}});document.addEventListener('change',async e=>{if(e.target.id!=='importFile')return;const file=e.target.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text()),d=obj.data;if(!d||!Array.isArray(d.animals)||!Array.isArray(d.bloodlines)||!Array.isArray(d.events))throw Error('Invalid backup format');if(!confirm('Importing will REPLACE all current local records. Continue?'))return;db={animals:d.animals,bloodlines:d.bloodlines,events:d.events,species:Array.isArray(d.species)?d.species:[]};if(save()){show('home');toast('Backup imported')}}catch(err){alert('Unable to import backup: '+err.message)}finally{e.target.value=''}});show('home')})();
</script></body></html>
